<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Generator danych testowych</title>
  <meta name="description" content="Generator losowych numerów PESEL, NPWZ, REGON, NIP i adresów e-mail z poprawnymi sumami kontrolnymi.">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <header>
      <h1>Generator danych testowych</h1>
      <p>Losowe numery z poprawnymi sumami kontrolnymi.</p>
    </header>

    <nav class="tabs" role="tablist" aria-label="Rodzaj danych">
      <button type="button" role="tab" data-type="pesel">PESEL</button>
      <button type="button" role="tab" data-type="npwz">NPWZ</button>
      <button type="button" role="tab" data-type="regon9">REGON 9</button>
      <button type="button" role="tab" data-type="regon14">REGON 14</button>
      <button type="button" role="tab" data-type="nip">NIP</button>
      <button type="button" role="tab" data-type="email">E-mail</button>
    </nav>

    <form id="settings" class="card">
      <div data-options="pesel" class="options">
        <label>Data urodzenia od
          <input type="date" id="pesel-from" value="1950-01-01" min="1800-01-01" max="2299-12-31">
        </label>
        <label>do
          <input type="date" id="pesel-to" value="2005-12-31" min="1800-01-01" max="2299-12-31">
        </label>
        <label>Płeć
          <select id="pesel-sex">
            <option value="any">dowolna</option>
            <option value="K">kobieta</option>
            <option value="M">mężczyzna</option>
          </select>
        </label>
      </div>
      <div data-options="nip" class="options">
        <label class="check">
          <input type="checkbox" id="nip-dashes"> z myślnikami (XXX-XXX-XX-XX)
        </label>
      </div>
      <div data-options="email" class="options">
        <label>Domena
          <input type="text" id="email-domain" value="example.com" spellcheck="false">
        </label>
      </div>
      <p id="no-options" class="muted">Brak dodatkowych opcji.</p>

      <div class="actions">
        <label>Liczba
          <input type="number" id="count" value="5" min="1" max="100">
        </label>
        <button type="submit" class="primary">Generuj</button>
      </div>
    </form>

    <section class="card">
      <div class="results-head">
        <h2>Wyniki</h2>
        <button type="button" id="copy-all">Kopiuj wszystkie</button>
      </div>
      <ul id="results"></ul>
    </section>

    <footer>
      Wygenerowane numery są losowe i służą wyłącznie do testów. Mogą przypadkowo
      pokrywać się z numerami prawdziwych osób lub firm.
    </footer>
  </main>

  <script src="generators.js"></script>
  <script src="app.js"></script>
</body>
</html>
